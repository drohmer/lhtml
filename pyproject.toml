[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lhtml-markup"
version = "2.2.0"
description = "Lightweight HTML markup language — simplifies HTML authoring with shorthand syntax"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1",
    "pygments>=2.15",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/drohmer/lhtml"
Repository = "https://github.com/drohmer/lhtml"
Issues = "https://github.com/drohmer/lhtml/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ansicolors",
]

[project.scripts]
lhtml = "lhtml:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lhtml = ["tag_element.lark"]

[tool.pytest.ini_options]
testpaths = ["test"]
